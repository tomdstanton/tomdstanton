name: Deploy Blog
on:
  push:
    branches: [ main ]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  build-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Build
        run: just build
      - name: Custom Domain
        run: echo "tomdstanton.com" > site/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: './site'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4